plugins {
    id 'java'
    id 'me.qoomon.git-versioning' version '6.4.4'
    id 'maven-publish'
}

group = 'me.gaminglounge'
version = '0.0.0'
gitVersioning.apply{
    refs {
        tag('v(?<version>.*)') {
            version = '${ref.version}'
        }
        tag('dev(?<version>.*)') {
            version = 'dev${ref.version}'
        }
        branch('.*') {
            version = '${ref}-${commit.short}-SNAPSHOT'
        }
    }
    rev {
        version = '${commit}'
    }
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name "gamingloungeMeGaminglounge"
        url "https://maven.gaminglounge.me/gaminglounge"
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:26.2.build.+"
    compileOnly "me.gaminglounge:item-builder:dev1.1.1.0"
    implementation "dev.jorel:commandapi-paper-shade:12.0.0"
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

publishing {
    repositories {
        //maven {
        //    name = "GitHubPackages"
        //    url = "https://maven.pkg.github.com/" + System.getenv("GITHUB_REPOSITORY")
        //    credentials {
        //        username = System.getenv("GITHUB_ACTOR")
        //        password = System.getenv("GITHUB_TOKEN")
        //    }
        //}
        maven {
            name = "SERVERNAME_REPOSITORYNAME"
            url = uri("https://maven.gaminglounge.me/gaminglounge")
            credentials {
                username = project.findProperty("MAVEN_USERNAME") ?: System.getenv("MAVEN_USERNAME")
                password = project.findProperty("MAVEN_PASSWORD") ?: System.getenv("MAVEN_PASSWORD")
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            from(components.java)
        }
    }
}